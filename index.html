<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>NOS</title>
  <!-- No TemplateData folder ships with this template (all CSS is inline
       below) — the default template's favicon/style links 404'd on every
       load. A real brand favicon arrives with the Phase 3 generic template
       / pre-boot config. -->

  <style>
    /* 1. Force the page to be Pitch Black */
    body,
    html {
      background-color: #000 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    /* Make the container and canvas fill the entire screen */
    #unity-container, #unity-canvas { 
        width: 100% !important; 
        height: 100% !important; 
    }

    /* 2. Center the Game Canvas */
    #unity-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    /* 3. The NOS Boot Sequence (Logo + Bar) */
    #unity-loading-bar {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.8s ease-in-out; /* Smooth 0.8s fade */
      opacity: 1;
      width: 100%;
      height: 100%;
      background: #000;
      pointer-events: none; /* Let clicks pass through once faded */
    }

    /* 4. Your Logo - Make sure 'Logo.png' is in your template folder */
    #unity-logo {
      width: 200px;
      height: 200px;
      background: url('Logo.png') no-repeat center;
      background-size: contain;
      margin-bottom: 30px;
      /* Optional: Subtle pulse effect while loading */
      animation: logo-pulse 2s infinite ease-in-out;
    }

    /* 5. Sleek Cyan Progress Bar */
    #unity-progress-bar-empty {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    #unity-progress-bar-full {
      background: #00d0db;
      /* NOS Cyan */
      height: 100%;
      width: 0%;
      transition: width 0.3s ease-out;
      box-shadow: 0 0 10px rgba(0, 208, 219, 0.5);
    }

    @keyframes logo-pulse {
      0% {
        opacity: 0.8;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.8;
      }
    }

  </style>
</head>

<body>
  <div id="unity-container">
    <!-- Use Unity Tags for Width/Height to stay in sync with Editor -->
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
  </div>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");
    function unityShowBanner(msg, type) {
      // ... (Keep your existing banner logic)
    }

    // ── WebGL drawing-buffer cap ─────────────────────────────────────────────
    // Unity multiplies the canvas backing store by window.devicePixelRatio, so a Retina
    // display asks for 4x the pixels (2x per axis). Windowed that is fine; at macOS
    // fullscreen on a large Retina screen it pushes the WebGL surface into the tens of
    // millions of pixels, past what Safari will allocate. The failure is not graceful:
    // it wedges the shared GPU/content process (freezing the whole browser, not just the
    // tab) and leaves the wasm runtime trapping with assorted call_indirect / out-of-bounds
    // errors. Clamping the effective ratio keeps the buffer inside a sane budget: on a huge
    // screen we render nearer 1x, which is slightly softer but stays alive.
    var UFOS_MAX_DRAWING_BUFFER_PIXELS = 8000000;   // ~8 MP, comfortably inside Safari's limits

    function ufosPixelRatio() {
      var dpr = window.devicePixelRatio || 1;
      var w = Math.max(1, window.innerWidth);
      var h = Math.max(1, window.innerHeight);
      var maxRatio = Math.sqrt(UFOS_MAX_DRAWING_BUFFER_PIXELS / (w * h));
      return Math.max(1, Math.min(dpr, maxRatio));   // never below 1x
    }

    // Use dynamic paths for the loader so it works on any build name
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/AIDesigner.loader.js";
    var config = {
      dataUrl: buildUrl + "/AIDesigner.data.unityweb",
      frameworkUrl: buildUrl + "/AIDesigner.framework.js.unityweb",
      codeUrl: buildUrl + "/AIDesigner.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "UFO Studios",
      productName: "NOS",
      productVersion: "0.1.260813.2312",
      showBanner: unityShowBanner,
      devicePixelRatio: ufosPixelRatio(),
    };

    // Recompute on resize: going fullscreen is exactly when the budget is exceeded, and
    // the ratio chosen at load no longer applies. Debounced, because macOS fullscreen
    // animates and fires a burst of resize events.
    var ufosRatioTimer = null;
    window.addEventListener("resize", function () {
      if (ufosRatioTimer) clearTimeout(ufosRatioTimer);
      ufosRatioTimer = setTimeout(function () {
        var inst = window.unityInstance;
        if (inst && inst.Module) inst.Module.devicePixelRatio = ufosPixelRatio();
      }, 120);
    });

    loadingBar.style.display = "flex";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        // REMOVED: loadingBar.style.display = "none";

        // This is the function Unity will call from C#
        window.triggerFadeOut = function () {
          var lb = document.getElementById("unity-loading-bar");
          if (lb) {
            lb.style.opacity = "0";
            setTimeout(function () { lb.style.display = "none"; }, 800);
          }
        };

      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>

</html>
